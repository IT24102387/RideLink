spring.application.name=driver-and-vehicle-service
server.port=${SERVER_PORT}

# Database Configuration (Driver Service Database Boundary)
spring.data.mongodb.uri=${MONGODB_URI}

# JWT Configuration (Consistent with Account Service)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Inter-Service Communication Base URLs
services.account-service.url=${ACCOUNT_SERVICE_URL:http://localhost:8080}
services.ride-service.url=${RIDE_SERVICE_URL:http://localhost:8082}
services.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8083}

