spring.application.name=ride-management-service
server.port=${SERVER_PORT}

# Database Configuration (Ride Service Database Boundary)
spring.data.mongodb.uri=${MONGODB_URI}

# JWT Configuration (Consistent with other microservices)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Inter-Service Communication Base URLs
services.account-service.url=${ACCOUNT_SERVICE_URL}
services.driver-service.url=${DRIVER_SERVICE_URL}
services.payment-service.url=${PAYMENT_SERVICE_URL}
